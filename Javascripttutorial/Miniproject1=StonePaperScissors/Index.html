<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone,Paper,Scissors Game</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div class="heading">Rock Paper Scissors Game</div>
    <div class="container">
        <div class="title">Select Your Move</div>

        <div class="item1">
            <div class="item1elements">
                <div id="stone" class="item1btn"><img src="fist.png" alt="stone"></div>
            </div>
            <div  class="item1elements">
                <div id="paper" class="item1btn"><img src="hello.png" alt="paper"></div>
            </div>
            <div  class="item1elements">
                <div id="scissors" class="item1btn"><img src="two.png" alt="scissors"></div>
            </div>
        </div>
        <div class="item2">
            <div class="item2containers">
                <span class="score" id="userscore">0</span>
                <h4>You</h4>
            </div>
            <div class="item2containers">
                <span class="score" id="compscore">0</span>
                <h4>Comp</h4>
            </div>
        </div>
        <div class="item3">
            <div class="item3containers">
                <button id="resultbtn" class="item3btn">PlayYour Move</button>
            </div>
            <div class="item3containers">
                <button id="resetbtn" class="item3btn">Reset Game</button>
            </div>
        </div>

    </div>
</body>
<script src="Script.js"></script>
</html>
