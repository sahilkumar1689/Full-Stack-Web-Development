<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body>
    
    <div class="container">

        <div class="heading"><Span>Currency Converter</Span></div>

        <div class="hero">

            <div class="amountDiv">
                <label for="amount">Enter Amount</label>
                <br>
                <input type="text" id="amount">
            </div>

            <div class="countrySelect">

                <div class="fromCountry">
                    <label for="country">From</label>
                    <div class="fromcontent">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="img">
                        <select name="from" id="county">
                            <option value="USD">USD</option>
                        </select>
                    </div>
                </div>

                <div class="img">
                    <i class="fa-solid fa-right-left"></i>
                </div>

                <div class="toCountry">
                    <label for="country">To</label>
                    <div class="fromcontent">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="img">
                        <select name="to" id="county">
                            <option value="INR">INR</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="result">
            <p>Submit To See Result</p>
        </div>

        <div class="button">
            <button>Get Exchange Rate</button>
        </div>

    </div>

</body>
<script src="Code.js"></script>
<script src="Script.js"></script>
</html>
