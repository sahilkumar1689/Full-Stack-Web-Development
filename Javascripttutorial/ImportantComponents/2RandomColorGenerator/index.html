<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Random Color Generator</title>
  </head>
  <body>
    <div class="container">
      <div class="innerItems" id="containerLeft">
        <p>#000000</p>
        <button id="generateLeftBtn">Generate Hex Color</button>
        <button id="copyLeftBtn">Copy to Clipboard</button>
      </div>
      <div class="innerItems" id="containerRight">
        <p>rgb(0,0,0)</p>
        <button id="generateRightBtn">Generate RGB Color</button>
        <button id="copyRightBtn">Copy to Clipboard</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
