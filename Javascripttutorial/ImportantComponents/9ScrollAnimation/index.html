<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .scrollContainer {
        width: 100%;
        height: 10px;
        background-color: black;
        position: fixed;
        top: 0;
        left: 0;
      }
      .scrollContainer .scroller {
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: white;
      }
      .postContainer {
        width: 100%;
        padding: 20px;
        text-align: justify;
        border: 2px solid black;
        background-color: rgba(216, 220, 223, 0.797);
      }
      .temp {
        position: sticky;
        top: 0;
        width: 100%;
        height: 50px;
        background-color: aquamarine;
      }
      .postItem {
        border: 2px solid black;
        margin: 10px;
        padding: 10px;
        line-height: 25px;
      }
    </style>
    <title>Scroll Animation</title>
  </head>
  <body>
    <div class="scrollContainer">
      <div class="scroller"></div>
    </div>

    <div class="postContainer"></div>

    <script src="index.js"></script>
  </body>
</html>
