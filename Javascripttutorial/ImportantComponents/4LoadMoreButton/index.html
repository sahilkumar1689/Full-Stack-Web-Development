<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: auto;
      }

      .container {
        width: 100%;
        height: 100%;
        border: 2px solid black;
        text-align: center;
      }
      .container h1 {
        margin: 20px;
      }
      .productContainer {
        width: 100%;
        height: auto;
        border: 2px solid green;
        display: flex;
        flex-flow: row wrap;
        gap: 16px;
        justify-content: center;
        align-items: center;
      }
      .container button {
        margin: 20px;
        padding: 10px 40px;
        background-color: rgba(0, 255, 255, 0.843);
        border-radius: 7px;
      }
      .items {
        width: 400px;
        height: 350px;
        border: 2px solid black;
      }
      .items img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }
      .items p {
        font-size: 16px;
      }
    </style>
    <title>LoadMoreButton</title>
  </head>
  <body>
    <div class="container">
      <h1>Products List:</h1>
      <div class="productContainer"></div>
      <button>Load More</button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
